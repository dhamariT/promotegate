<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PromoteGate</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <aside>
    <div class="brand">PromoteGate</div>
    <p class="brand-note">Failure models for ABB equipment</p>
    <nav>
      <button type="button" data-page="update" class="active">Pending update</button>
      <button type="button" data-page="explain">Why it scored</button>
      <button type="button" data-page="audit">History</button>
      <button type="button" data-page="data">Recordings</button>
    </nav>
  </aside>
  <div class="shell">
    <header>
      <div>
        <p class="kicker" id="fleet-name">ABB IRB 6660</p>
        <h1 id="page-title">Overview</h1>
      </div>
      <div class="prod" id="incumbent">Production model</div>
    </header>
    <main id="app">
      <p class="quiet">Loading the held-out result.</p>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
